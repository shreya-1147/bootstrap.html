<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Example</title>
        <!--Bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <h1 class="text-center">Hello, Bootstrap!</h1>
            <div class="container bg-dark text-white p-3">
                Fixed Width Container
            </div>
                <div class="container-fluid bg-warning p-3">
                    Full Width Container
        </div>
        <div class="container">
            <div class="row">
                <div class="col-md-4 bg-primary text-white p-3">
                    Column 1
                </div>
                <div class="col-md-4 bg-success text-white p-3">
                    Column 2
                </div>
                <div class="col-md-4 bg-info text-white p-3">
                    Column 3
                </div>
            </div>
        </div>
        <div class="col-4 bg primary p-3">4 Columns</div>
        <div class="col-8 bg secondary p-3">8 Columns</div>
        </div>
        <!--Bootstrap JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
